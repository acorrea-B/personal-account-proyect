name: Deploy

on:
  # Production deploy: a tag vX.Y.Z (semver) deploys the tagged commit.
  push:
    tags: ["v*"]
  # Manual redeploy (also production).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the api function with Terraform
    runs-on: ubuntu-latest
    # The only protected environment of the repository: production — the
    # tag deploys and the manual redeploy are the same destination (D16).
    environment:
      name: production
    # The tag deploys always (the tag is cut on a commit whose CI is green —
    # that is the discipline of the tag, not a workflow gate: D16) and the
    # forks never deploy.
    if: ${{ github.event.repository.fork == false }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ENVIRONMENT_NAME: production
      # Scaleway credentials. The API provider (scaleway/terraform) talks to
      # the REST API with the secret key alone; the S3 backend that stores the
      # state needs the whole key pair, hence SCALEWAY_ACCESS_KEY.
      SCW_ACCESS_KEY:  ${{ secrets.SCALEWAY_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
      SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_JWT_ISSUER: ${{ secrets.SUPABASE_JWT_ISSUER }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
      SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      # Non-secret configuration of the function (plan §12.2) -> terraform
      # vars of the same snake_case name. The secrets of the function are
      # attached out of the pipeline (Scaleway console or Terraform with
      # SOPS): they never travel through GitHub — Terraform does not declare
      # secret_environment_variables and never touches them.
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      MAX_BODY_BYTES: ${{ vars.MAX_BODY_BYTES }}
      REQUEST_TIMEOUT_SECS: ${{ vars.REQUEST_TIMEOUT_SECS }}
      DB_MAX_CONNECTIONS: ${{ vars.DB_MAX_CONNECTIONS }}
      RATE_LIMIT_LOGIN_PER_MIN: ${{ vars.RATE_LIMIT_LOGIN_PER_MIN }}
      RATE_LIMIT_RESEND_PER_10MIN: ${{ vars.RATE_LIMIT_RESEND_PER_10MIN }}
      RATE_LIMIT_CV_WRITE_PER_MIN: ${{ vars.RATE_LIMIT_CV_WRITE_PER_MIN }}
      RATE_LIMIT_REQUEST_PER_MIN: ${{ vars.RATE_LIMIT_REQUEST_PER_MIN }}
      CV_MAX_BYTES: ${{ vars.CV_MAX_BYTES }}
      CV_VERSIONS_RETENTION: ${{ vars.CV_VERSIONS_RETENTION }}
      # Optional: explicit target of the smoke test; by default it reads the
      # `function_endpoint` output of Terraform.
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Package the function sources
        run: ./package.sh

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.10.0'
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra
        run: terraform init -no-color

      # Single workspace: the only destination is production (D16 — staging
      # does not exist).
      - name: Select the workspace
        working-directory: infra
        run: terraform workspace select -or-create "$ENVIRONMENT_NAME"

      # The migration step (R10) lands with the `migrate` function (T003):
      # apply it first, invoke it and only apply `api` on a 200 (plan §12.2).
      - name: Apply
        working-directory: infra
        run: |
          set -euo pipefail
          VARS_ARGS=()
          for name in ALLOWED_ORIGINS MAX_BODY_BYTES REQUEST_TIMEOUT_SECS \
            DB_MAX_CONNECTIONS RATE_LIMIT_LOGIN_PER_MIN \
            RATE_LIMIT_RESEND_PER_10MIN RATE_LIMIT_CV_WRITE_PER_MIN \
            RATE_LIMIT_REQUEST_PER_MIN CV_MAX_BYTES CV_VERSIONS_RETENTION \
            SCW_PROJECT_ID SUPABASE_URL \
            SUPABASE_JWT_ISSUER DATABASE_URL SUPABASE_JWKS_URL \
            SERVICE_ROLE_KEY SUPABASE_PUBLISHABLE_KEY; do
            VARS_ARGS+=("-var" "${name,,}=$(printenv "$name")")
          done
          terraform apply -auto-approve -input=false -no-color \
            -var "stage=$ENVIRONMENT_NAME" "${VARS_ARGS[@]}"

      - name: Record the deployed version
        run: |
          echo "Deployed \`${DEPLOY_SHA}\` to $ENVIRONMENT_NAME." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        working-directory: infra
        run: |
          set -euo pipefail
          URL="${PUBLIC_URL:-$(terraform output -raw function_endpoint)}"
          FNID=$(terraform output -raw function_id)
          REGION=$(echo "$FNID" | cut -d/ -f1)

          # The platform compiles the crate AFTER terraform apply returns (a
          # Rust cold build takes minutes): the smoke first waits for the
          # build state the API reports — error ends fast, with the cause
          # instead of 10 blind curls.
          for attempt in $(seq 1 80); do
            STATUS=$(curl --silent --max-time 15 \
              -H "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/functions/v1beta1/regions/$REGION/functions/$FNID" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')
            case "$STATUS" in
              ready|healthy)
                echo "The function build is $STATUS"
                break
                ;;
              error)
                echo "::error::the function build failed — see the build logs in the Scaleway console (namespace perfil-api-production)"
                exit 1
                ;;
              *)
                echo "Attempt $attempt: the function build is '$STATUS' — waiting (a Rust cold build takes minutes)"
                sleep 15
                ;;
            esac
          done

          # The build is ready: the HTTP gate has a small window now — the
          # function answers ok or the smoke names the problem.
          for attempt in $(seq 1 6); do
            if curl --silent --fail --max-time 10 "$URL/health" 2>/dev/null | grep --quiet '^ok$'; then
              echo "The function answers at $URL/health"
              exit 0
            fi
            echo "Attempt $attempt: /health did not answer ok"
            sleep 5
          done
          echo "::error::the smoke test failed at $URL/health (the build was ready)"
          exit 1