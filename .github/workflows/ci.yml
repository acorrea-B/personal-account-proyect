name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bootstrap excluded from the coverage numerator (plan §12.2, D17/ADR 0016):
  # `main.rs` (development server), `lib.rs` (adapter of the platform),
  # `config.rs` and `state.rs` (startup) hold no business logic. The list
  # shrinks as the domain code lands (T004+).
  COVERAGE_EXCLUDES: '.*src/(main|lib|config|state)\.rs'

jobs:
  quality:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      # The DB of the integration tests: Supabase local (§12.3) — the
      # repository tests skip silently when it is absent; without it the
      # coverage would fall under the gate (D17).
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase init && supabase start

      - name: Export the local credentials for the integration tests
        run: |
          STATUS=$(supabase status -o env)
          for pair in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET; do
            echo "$STATUS" | grep "^$pair=" | head -n 1 >> "$GITHUB_ENV"
          done
          # The publishable of the new key system occupies the anon slot.
          KEY=$(echo "$STATUS" | grep '^SUPABASE_ANON_KEY=' | head -n 1 | cut -d= -f2-)
          echo "SUPABASE_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"
          # The legacy gotrue of Supabase local does not emit issuer.
          echo "SUPABASE_JWT_ISSUER=" >> "$GITHUB_ENV"

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same DB of the tests: the coverage measures the repositories
      # (the tests skip silently without DB and the gate would fail).
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase init && supabase start

      - name: Export the local credentials for the integration tests
        run: |
          STATUS=$(supabase status -o env)
          for pair in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET; do
            echo "$STATUS" | grep "^$pair=" | head -n 1 >> "$GITHUB_ENV"
          done
          # The publishable of the new key system occupies the anon slot.
          KEY=$(echo "$STATUS" | grep '^SUPABASE_ANON_KEY=' | head -n 1 | cut -d= -f2-)
          echo "SUPABASE_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"
          # The legacy gotrue of Supabase local does not emit issuer.
          echo "SUPABASE_JWT_ISSUER=" >> "$GITHUB_ENV"

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage report
        run: |
          cargo llvm-cov \
            --fail-under-lines 90 \
            --ignore-filename-regex "$COVERAGE_EXCLUDES" \
            --json \
            --output-path coverage.json

      - name: Ratchet against the base branch
        run: |
          set -euo pipefail
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
          if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo "The branch has no base commit: the ratchet is skipped."
            exit 0
          fi
          BASE_DIR="$RUNNER_TEMP/base"
          BASE_REPORT="$RUNNER_TEMP/base-coverage.json"
          git worktree add "$BASE_DIR" "$BASE"
          if ! (cd "$BASE_DIR" && cargo llvm-cov \
            --ignore-filename-regex "$COVERAGE_EXCLUDES" \
            --json \
            --output-path "$BASE_REPORT" >/dev/null 2>&1); then
            echo "The base commit has no measurable coverage: the ratchet is skipped."
            exit 0
          fi
          CURRENT=$(jq -r '(.data[0].totals.lines.percent // .totals.lines.percent // 0)' coverage.json)
          BASE_PERCENT=$(jq -r '(.data[0].totals.lines.percent // .totals.lines.percent // 0)' "$BASE_REPORT")
          echo "Coverage: base $BASE_PERCENT% -> branch $CURRENT%"
          if awk -v current="$CURRENT" -v base="$BASE_PERCENT" 'BEGIN { exit !(current < base) }'; then
            echo "::error::the coverage of the branch ($CURRENT%) is below the base ($BASE_PERCENT%)"
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit the dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  terraform_plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    # Read-only plan against the production workspace (plan §12.2): the PR shows
    # the infrastructure change before the merge can apply it. It is skipped
    # for the forks: they never reach the project credentials.
    # The credentials live as environment secrets of `production` (the only
    # environment of the repository): a job only sees them declaring it.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    environment: production
    env:
      SCW_ACCESS_KEY:  ${{ secrets.SCALEWAY_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
      SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_JWT_ISSUER: ${{ secrets.SUPABASE_JWT_ISSUER }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
      SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      MAX_BODY_BYTES: ${{ vars.MAX_BODY_BYTES }}
      REQUEST_TIMEOUT_SECS: ${{ vars.REQUEST_TIMEOUT_SECS }}
      DB_MAX_CONNECTIONS: ${{ vars.DB_MAX_CONNECTIONS }}
      RATE_LIMIT_LOGIN_PER_MIN: ${{ vars.RATE_LIMIT_LOGIN_PER_MIN }}
      RATE_LIMIT_RESEND_PER_10MIN: ${{ vars.RATE_LIMIT_RESEND_PER_10MIN }}
      RATE_LIMIT_CV_WRITE_PER_MIN: ${{ vars.RATE_LIMIT_CV_WRITE_PER_MIN }}
      RATE_LIMIT_REQUEST_PER_MIN: ${{ vars.RATE_LIMIT_REQUEST_PER_MIN }}
      CV_MAX_BYTES: ${{ vars.CV_MAX_BYTES }}
      CV_VERSIONS_RETENTION: ${{ vars.CV_VERSIONS_RETENTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Package the function sources
        run: ./package.sh

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.10.0'
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra
        run: terraform init -no-color

      # -detailed-exitcode: 0 = no changes, 2 = changes (fine for a PR), 1 =
      # the plan itself failed.
      - name: Plan
        working-directory: infra
        run: |
          set -euo pipefail
          terraform workspace select -or-create production
          VARS_ARGS=()
          for name in ALLOWED_ORIGINS MAX_BODY_BYTES REQUEST_TIMEOUT_SECS \
            DB_MAX_CONNECTIONS RATE_LIMIT_LOGIN_PER_MIN \
            RATE_LIMIT_RESEND_PER_10MIN RATE_LIMIT_CV_WRITE_PER_MIN \
            RATE_LIMIT_REQUEST_PER_MIN CV_MAX_BYTES CV_VERSIONS_RETENTION \
            SCW_PROJECT_ID SUPABASE_URL \
            SUPABASE_JWT_ISSUER DATABASE_URL SUPABASE_JWKS_URL \
            SERVICE_ROLE_KEY SUPABASE_PUBLISHABLE_KEY; do
            VARS_ARGS+=("-var" "${name,,}=$(printenv "$name")")
          done
          set +e
          terraform plan -input=false -no-color -detailed-exitcode \
            -var "stage=production" "${VARS_ARGS[@]}" | tee plan.txt
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" = "1" ] || [ "$RC" -gt 2 ]; then
            echo "::error::the terraform plan failed (exit $RC)"
            exit 1
          fi

      - name: Append the plan to the summary
        if: ${{ always() }}
        run: |
          if [ -f infra/plan.txt ]; then
            sed 's/^/    /' infra/plan.txt >> "$GITHUB_STEP_SUMMARY"
          fi
